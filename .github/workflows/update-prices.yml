name: Update prices

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch prices
        env:
          # Public project id (repository variable). The product list is publicly readable, so no secret is needed here:
          # prices are always updated, even without FIREBASE_SERVICE_ACCOUNT.
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          PRICE_CHANGES_PATH: ${{ runner.temp }}/price-changes.json
        run: npm run update-prices

      - name: Commit if prices changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "chore: aggiorna prezzi"
            git pull --rebase --autostash
            git push
          fi

      - name: Notify price changes
        # Runs only after the push succeeded (a failed step stops the job). A failed push leaves the change to the next
        # run, so it is never notified twice. Without the secret the notifications are skipped with a warning.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PRICE_CHANGES_PATH: ${{ runner.temp }}/price-changes.json
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::Notifiche disattivate: FIREBASE_SERVICE_ACCOUNT non impostato"
            exit 0
          fi
          npm run notify-price-changes -- "$PRICE_CHANGES_PATH"
