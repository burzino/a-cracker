<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#3f2b96"/>
  <!-- cracker: ombra e corpo -->
  <rect x="96" y="160" width="290" height="220" rx="42" fill="#c98a2e"/>
  <rect x="96" y="150" width="290" height="220" rx="42" fill="#e8b657"/>
  <!-- fori tipici del cracker -->
  <g fill="#c98a2e">
    <circle cx="150" cy="205" r="12"/>
    <circle cx="214" cy="196" r="12"/>
    <circle cx="282" cy="200" r="12"/>
    <circle cx="346" cy="318" r="12"/>
    <circle cx="150" cy="320" r="12"/>
    <circle cx="226" cy="330" r="12"/>
  </g>
  <!-- linea del tracker: alone blu + linea bianca -->
  <polyline points="72,330 140,290 190,320 250,240 300,265 360,200 420,150" fill="none" stroke="#3f2b96" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="72,330 140,290 190,320 250,240 300,265 360,200 420,150" fill="none" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- punto evidenziato finale -->
  <circle cx="420" cy="150" r="30" fill="#ffffff" stroke="#3f2b96" stroke-width="12"/>
</svg>
